tensions:
  - tension_id: creative-speed-and-finished-quality
    principles: [skill-a06-high-heat-drafting, skill-a07-work-persists-labor-fades]
    why_tension_exists: "Both rapid first-draft momentum and lasting product quality matter at different stages."
    prefer_a_when: ["Early exploration where delay reduces learning or idea freshness."]
    prefer_b_when: ["Late production and release work where defects reach players."]
    combine_when: ["Use speed to produce a testable draft, then schedule evidence-led refinement."]
    failure_mode_if_a_overapplied: "Rough work ships without validation or finish."
    failure_mode_if_b_overapplied: "Polish consumes time before the core idea is tested."
  - tension_id: decisive-plan-and-adaptive-specification
    principles: [skill-a11-no-plan-b, skill-a04-agile-spec-adaptation]
    why_tension_exists: "A clear committed direction can coexist with revising a failing design."
    prefer_a_when: ["Selecting and communicating a creative direction."]
    prefer_b_when: ["New evidence or constraints invalidate the current specification."]
    combine_when: ["Keep one active product direction while allowing explicit change decisions."]
    failure_mode_if_a_overapplied: "Premature hedging weakens focus."
    failure_mode_if_b_overapplied: "Commitment becomes refusal to learn."
  - tension_id: director-authorship-and-broad-input
    principles: [skill-a08-director-individuality, skill-a13-broad-input-output]
    why_tension_exists: "Distinctive direction benefits from outside information and challenge."
    prefer_a_when: ["Choosing a coherent creative point of view and making the accountable call."]
    prefer_b_when: ["Exploration, specialist review, accessibility, safety, or platform compliance."]
    combine_when: ["Gather diverse input, then let the accountable owner resolve the creative choice."]
    failure_mode_if_a_overapplied: "Direction collapses into an averaged consensus."
    failure_mode_if_b_overapplied: "Authorship dismisses useful evidence or required needs."
  - tension_id: fast-onboarding-and-sufficient-teaching
    principles: [skill-plan-002, skill-plan-007]
    why_tension_exists: "Quickly reaching play can conflict with enough guided practice."
    prefer_a_when: ["First minutes where immediate interaction demonstrates the premise."]
    prefer_b_when: ["A novel or high-consequence mechanic needs supported practice."]
    combine_when: ["Teach in context while keeping optional replay and reference."]
    failure_mode_if_a_overapplied: "Players are delayed by unnecessary explanation."
    failure_mode_if_b_overapplied: "Players are dropped into opaque rules without support."
